name: Publish Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:
    description: Manually trigger a publish of the Chrome extension

jobs:
  build-and-publish:
    name: Build & Publish Chrome Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension bundle
        run: npm run build:extension

      - name: Publish latest build to release branch
        env:
          GITHUB_TOKEN: ${{ secrets.SEMVER_CHROMENOTES }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf release
          mkdir release
          cp -R dist/. release/

          cd release
          git init
          git checkout -b latest-stable-release
          git add .
          git commit -m "chore: update extension build ${SOURCE_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" latest-stable-release
